name: Build BuyTime Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35 Components
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Error: sdkmanager executable not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK Output
        run: |
          echo "Checking app-debug.apk exists and is non-empty..."
          if [ -s app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Artifact verified: app/build/outputs/apk/debug/app-debug.apk is present and non-empty."
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Error: app/build/outputs/apk/debug/app-debug.apk was not found or is empty!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuyTime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
